<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videxo example</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      fieldset {
        margin: 1rem 0;
      }
      label {
        display: block;
      }
      .problem {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <h1>Videxo example</h1>
    <p>Pick a file: the browser uploads it to Videxo with a one-time URL from this server, then the server creates the job.</p>
    <form id="job">
      <label>File <input type="file" name="file" required /></label>
      <fieldset>
        <legend>Job</legend>
        <label><input type="radio" name="kind" value="transcode" checked /> One MP4 (POST /v1/transcode)</label>
        <label><input type="radio" name="kind" value="jobs" /> MP4, poster and GIF preview in one job (POST /v1/jobs)</label>
      </fieldset>
      <button type="submit">Upload and process</button>
    </form>
    <p id="status" role="status"></p>
    <ul id="outputs"></ul>
    <div id="problem" class="problem" role="alert"></div>
    <script type="module">
      // The same page and the same routes in every server example: POST /api/uploads, PUT to the
      // upload URL, POST /api/jobs, GET /api/jobs/:id until the job ends, GET /api/jobs/:id/outputs/:alias.
      const form = document.querySelector('#job');
      const status = document.querySelector('#status');
      const outputs = document.querySelector('#outputs');
      const problem = document.querySelector('#problem');

      /** A plain filename as the API wants it: letters, digits, dots, underscores and hyphens. */
      const plainName = (name) =>
        name
          .replace(/[^A-Za-z0-9_.-]+/g, '-')
          .replace(/^[^A-Za-z0-9]+/, '')
          .slice(-100) || 'upload.bin';

      /** A JSON request to this app; an error answer is thrown as its problem details. */
      async function call(path, body) {
        const response = await fetch(
          path,
          body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {},
        );
        const json = await response.json().catch(() => null);
        if (!response.ok) throw json ?? { title: 'The server answered with an error.', detail: `HTTP ${response.status}` };
        return json;
      }

      function showProblem(error) {
        const details = error && typeof error === 'object' ? error : { title: String(error) };
        problem.replaceChildren(
          Object.assign(document.createElement('p'), { textContent: [details.title, details.detail].filter(Boolean).join(' ') }),
          ...(details.errors ?? []).map((item) =>
            Object.assign(document.createElement('p'), {
              textContent: `${item.pointer ?? item.parameter ?? item.header ?? ''} ${item.detail}`,
            }),
          ),
        );
        status.textContent = '';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        problem.replaceChildren();
        outputs.replaceChildren();
        const file = form.elements.file.files[0];
        const contentType = file.type || 'application/octet-stream';
        try {
          status.textContent = 'Creating the upload';
          const upload = await call('/api/uploads', { filename: plainName(file.name), size_bytes: file.size, content_type: contentType });
          status.textContent = 'Uploading';
          const put = await fetch(upload.upload_url, { method: 'PUT', headers: { 'content-type': contentType }, body: file });
          if (!put.ok) throw await put.json().catch(() => ({ title: 'The upload failed.', detail: `HTTP ${put.status}` }));
          let job = await call('/api/jobs', { kind: form.elements.kind.value, input_url: upload.input_url });
          while (job.state === 'queued' || job.state === 'running') {
            status.textContent = `Job ${job.id}: ${job.state}`;
            await new Promise((resolve) => setTimeout(resolve, 2000));
            job = await call(`/api/jobs/${job.id}`);
          }
          status.textContent = `Job ${job.id}: ${job.state}${job.error ? ` (${job.error.code}: ${job.error.message})` : ''}`;
          outputs.replaceChildren(
            ...job.outputs.map((output) => {
              const link = Object.assign(document.createElement('a'), {
                href: `/api/jobs/${job.id}/outputs/${output.alias}`,
                textContent: output.filename,
              });
              const item = document.createElement('li');
              item.append(link);
              return item;
            }),
          );
        } catch (error) {
          showProblem(error);
        }
      });
    </script>
  </body>
</html>
